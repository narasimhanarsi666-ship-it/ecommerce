version: "3.9"
services:
  backend:
    build: ./ecommerce-backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
  frontend:
    build: ./ecommerce-frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    command: npm run dev
    ports: ["3000:3000"]
